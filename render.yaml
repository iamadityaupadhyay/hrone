services:
  - type: web
    name: hrone-attendance-service
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start & npm run worker
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: test
      - key: TZ
        value: Asia/Kolkata
